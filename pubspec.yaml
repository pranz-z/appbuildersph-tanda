name: tanda
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  connectivity_plus: 7.3.2
  drift: 2.35.1
  drift_flutter: 0.3.1
  file_picker: 13.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  just_audio: 0.10.6
  llamadart: 0.10.0
  path: 1.9.1
  path_provider: 2.1.6
  permission_handler: 13.0.2
  record: 7.1.1
  sherpa_onnx: 1.13.8
  uuid: 4.6.0
  wakelock_plus: 1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: 2.35.1
  build_runner: 2.16.1

flutter:
  uses-material-design: true
  assets:
    - assets/extract.gbnf
    - assets/extract_prompt.txt
    - test_sentences.md

# llamadart downloads prebuilt llama.cpp binaries at BUILD time only.
# Ship only the GGUF runtime, CPU backend (no Vulkan / LiteRT-LM).
hooks:
  user_defines:
    llamadart:
      llamadart_native_runtimes: [llama_cpp]
      llamadart_native_backends:
        platforms:
          android-arm64:
            backends: [cpu]
